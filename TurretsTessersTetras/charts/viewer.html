<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurretsTessersTetras Charts</title>
<style>
:root{--bg:#16171a;--panel:#1d1e22;--line:#2e3036;--text:#e8e8ea;--mute:#9a9ca3;--accent:#f0c040;--sel:#2a2c33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 0}
#side h1{font-size:15px;margin:0 14px 10px;color:var(--accent)}
#side .item{margin:12px 14px 4px;font-weight:600;font-size:13px;color:var(--text)}
#side a{display:block;padding:5px 14px 5px 22px;color:var(--mute);text-decoration:none;font-size:12.5px;border-left:3px solid transparent}
#side a:hover{color:var(--text);background:var(--sel)}
#side a.on{color:var(--text);background:var(--sel);border-left-color:var(--accent)}
#main{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#title{flex:1 1 320px;min-width:0;font-weight:600}
#title small{display:block;color:var(--mute);font-weight:400}
button{background:#2a2c33;color:var(--text);border:1px solid #3a3d45;border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{background:#343741}
#count{color:var(--mute);min-width:64px;text-align:center}
#stage{position:relative;overflow:hidden;cursor:grab;touch-action:none;background:var(--bg)}
#stage.drag{cursor:grabbing}
#img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;image-rendering:auto}
#hint{position:absolute;right:12px;bottom:10px;color:var(--mute);font-size:12px;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px;pointer-events:none}
#menu{display:none}
@media (max-width:760px){
 #app{grid-template-columns:1fr}
 #side{display:none;position:fixed;inset:0 25% 0 0;z-index:5}
 #side.open{display:block}
 #menu{display:inline-block}
 #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
 <nav id="side"><h1>TurretsTessersTetras charts</h1><div id="list"></div></nav>
 <div id="main">
  <div id="bar">
   <button id="menu" title="Charts list">&#9776;</button>
   <button id="prev" title="Previous chart (Left arrow)">&#9664; Prev</button>
   <span id="count"></span>
   <button id="next" title="Next chart (Right arrow)">Next &#9654;</button>
   <div id="title"></div>
   <button id="out" title="Zoom out (-)">&minus;</button>
   <button id="in" title="Zoom in (+)">+</button>
   <button id="fit" title="Fit the width (0)">Fit</button>
   <button id="full" title="Actual size (1)">100%</button>
   <a id="open" target="_blank" rel="noopener"><button title="Open the picture file">File</button></a>
  </div>
  <div id="stage"><img id="img" alt=""><div id="hint">Drag to move &middot; wheel or pinch to zoom &middot; double-click to zoom in &middot; &larr; &rarr; for the previous and next chart</div></div>
 </div>
</div>
<script>
const CHARTS = [{"item": "T-Stop-Slow", "title": "The T-Stop/Slow, pressing #34: every cell", "src": "T-Stop-Slow/1%20-%20The%20T-Stop-Slow%2C%20pressing%20%2334%20-%20every%20cell.png"}, {"item": "T-Stop-Slow", "title": "The T-Stop/Slow, pressing #34: Timer by boxes (every Timer value against every box)", "src": "T-Stop-Slow/2%20-%20The%20T-Stop-Slow%2C%20pressing%20%2334%20-%20Timer%20by%20boxes%20%28every%20Timer%20value%20against%20every%20box%29.png"}, {"item": "Zemeckis Cube", "title": "The Zemeckis Cube, pressing #41, one pack 2_13: box chart, every cell", "src": "Zemeckis%20Cube/1%20-%20The%20Zemeckis%20Cube%2C%20pressing%20%2341%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Zemeckis Cube", "title": "The Zemeckis Cube, pressing #41, one pack 2_13: Timer by boxes (every Timer value against every box)", "src": "Zemeckis%20Cube/2%20-%20The%20Zemeckis%20Cube%2C%20pressing%20%2341%2C%20one%20pack%202_13%20-%20Timer%20by%20boxes%20%28every%20Timer%20value%20against%20every%20box%29.png"}, {"item": "Tessers", "title": "Tessers, one pack 2_13: box chart, every cell", "src": "Tessers/1%20-%20Tessers%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Multidimensional Button", "title": "Multidimensional Button, one pack 2_13: box chart, every cell", "src": "Multidimensional%20Button/1%20-%20Multidimensional%20Button%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Multidimensional Button", "title": "Multidimensional Button, one pack 2_13: boxes by boxes, for each Button Type", "src": "Multidimensional%20Button/2%20-%20Multidimensional%20Button%2C%20one%20pack%202_13%20-%20boxes%20by%20boxes%2C%20for%20each%20Button%20Type.png"}, {"item": "Player-Tesser", "title": "Player-Tesser, one pack 2_13: box chart, every cell", "src": "Player-Tesser/1%20-%20Player-Tesser%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Portal Cube", "title": "The Portal Cube, one pack 2_13: every pair of boxes, then no boxes, then three boxes or more", "src": "Portal%20Cube/1%20-%20The%20Portal%20Cube%2C%20one%20pack%202_13%20-%20every%20pair%20of%20boxes%2C%20then%20no%20boxes%2C%20then%20three%20boxes%20or%20more.png"}, {"item": "Portal Cube", "title": "The Portal Cube, one pack 2_13: Cube Types by boxes (every Cube Type against every box)", "src": "Portal%20Cube/2%20-%20The%20Portal%20Cube%2C%20one%20pack%202_13%20-%20Cube%20Types%20by%20boxes%20%28every%20Cube%20Type%20against%20every%20box%29.png"}, {"item": "Portal Cube", "title": "The Portal Cube, one pack 2_13: Cube Type Companion, boxes by boxes", "src": "Portal%20Cube/3%20-%20The%20Portal%20Cube%2C%20one%20pack%202_13%20-%20Cube%20Type%20Companion%2C%20boxes%20by%20boxes.png"}, {"item": "Portal Cube", "title": "The Portal Cube, one pack 2_13: Cube Type Reflection, boxes by boxes", "src": "Portal%20Cube/4%20-%20The%20Portal%20Cube%2C%20one%20pack%202_13%20-%20Cube%20Type%20Reflection%2C%20boxes%20by%20boxes.png"}, {"item": "Portal Cube", "title": "The Portal Cube, one pack 2_13: Cube Type Sphere, boxes by boxes", "src": "Portal%20Cube/5%20-%20The%20Portal%20Cube%2C%20one%20pack%202_13%20-%20Cube%20Type%20Sphere%2C%20boxes%20by%20boxes.png"}, {"item": "Portal Cube", "title": "The Portal Cube, one pack 2_13: Cube Type Franken, boxes by boxes", "src": "Portal%20Cube/6%20-%20The%20Portal%20Cube%2C%20one%20pack%202_13%20-%20Cube%20Type%20Franken%2C%20boxes%20by%20boxes.png"}, {"item": "Turret Target Flip Panel", "title": "The Turret Target Flip Panel, one pack 2_13: every cell", "src": "Turret%20Target%20Flip%20Panel/1%20-%20The%20Turret%20Target%20Flip%20Panel%2C%20one%20pack%202_13%20-%20every%20cell.png"}, {"item": "Tetrahedral Cube", "title": "The Tetracube (Standard), pressing #51, the one pack 2.13: every pair of boxes, then no boxes and three boxes or more", "src": "Tetrahedral%20Cube/1%20-%20The%20Tetracube%20%28Standard%29%2C%20pressing%20%2351%2C%20the%20one%20pack%202.13%20-%20every%20pair%20of%20boxes%2C%20then%20no%20boxes%20and%20three%20boxes%20or%20more.png"}, {"item": "Tetrahedral Cube", "title": "The Tetracube, pressing #51, the one pack 2.13: boxes by boxes, for each Cube Type (Companion, Reflection, Old-Style, IcosoKey)", "src": "Tetrahedral%20Cube/2%20-%20The%20Tetracube%2C%20pressing%20%2351%2C%20the%20one%20pack%202.13%20-%20boxes%20by%20boxes%2C%20for%20each%20Cube%20Type%20%28Companion%2C%20Reflection%2C%20Old-Style%2C%20IcosoKey%29.png"}, {"item": "Tetrabutton (Tributton)", "title": "The Tetrabutton (Weighted), pressing #47, the one pack 2.13: every cell", "src": "Tetrabutton%20%28Tributton%29/1%20-%20The%20Tetrabutton%20%28Weighted%29%2C%20pressing%20%2347%2C%20the%20one%20pack%202.13%20-%20every%20cell.png"}, {"item": "Tetrabutton (Tributton)", "title": "The Tetrabutton, pressing #47, the one pack 2.13: Button Types by boxes (every Button Type against every box)", "src": "Tetrabutton%20%28Tributton%29/2%20-%20The%20Tetrabutton%2C%20pressing%20%2347%2C%20the%20one%20pack%202.13%20-%20Button%20Types%20by%20boxes%20%28every%20Button%20Type%20against%20every%20box%29.png"}, {"item": "Rotatable Faith Plate", "title": "Rotatable Faith Plate, one pack 2_13: box chart, every cell", "src": "Rotatable%20Faith%20Plate/1%20-%20Rotatable%20Faith%20Plate%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Rotatable Faith Plate", "title": "Rotatable Faith Plate, one pack 2_13: boxes by boxes, for each Cube Type", "src": "Rotatable%20Faith%20Plate/2%20-%20Rotatable%20Faith%20Plate%2C%20one%20pack%202_13%20-%20boxes%20by%20boxes%2C%20for%20each%20Cube%20Type.png"}, {"item": "Turret Detection Plate", "title": "Turret Detection Plate, one pack 2_13: box chart, every cell", "src": "Turret%20Detection%20Plate/1%20-%20Turret%20Detection%20Plate%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Turret Detection Plate", "title": "Turret Detection Plate, one pack 2_13: boxes by boxes, for each Cube Type", "src": "Turret%20Detection%20Plate/2%20-%20Turret%20Detection%20Plate%2C%20one%20pack%202_13%20-%20boxes%20by%20boxes%2C%20for%20each%20Cube%20Type.png"}, {"item": "Remote-Control Device (Universal Remote)", "title": "Turret-Portal and Focused-Energy Remote-Control Device, one pack 2_13: box chart, every cell", "src": "Remote-Control%20Device%20%28Universal%20Remote%29/1%20-%20Turret-Portal%20and%20Focused-Energy%20Remote-Control%20Device%2C%20one%20pack%202_13%20-%20box%20chart%2C%20every%20cell.png"}, {"item": "Remote-Control Device (Universal Remote)", "title": "Turret-Portal and Focused-Energy Remote-Control Device, one pack 2_13: boxes by boxes, for each Cube Type", "src": "Remote-Control%20Device%20%28Universal%20Remote%29/2%20-%20Turret-Portal%20and%20Focused-Energy%20Remote-Control%20Device%2C%20one%20pack%202_13%20-%20boxes%20by%20boxes%2C%20for%20each%20Cube%20Type.png"}, {"item": "Projectile Detection-Retention Filter", "title": "Projectile Detection-Retention Filter, one pack 2_12: every cell", "src": "Projectile%20Detection-Retention%20Filter/1%20-%20Projectile%20Detection-Retention%20Filter%2C%20one%20pack%202_12%20-%20every%20cell.png"}, {"item": "Turret Recharging Station", "title": "The Turret Recharging Station, one pack 2_28: every cell", "src": "Turret%20Recharging%20Station/1%20-%20The%20Turret%20Recharging%20Station%2C%20one%20pack%202_28%20-%20every%20cell.png"}, {"item": "Turret Target Flip Panel", "title": "The Turret Target Flip Panel, one pack 2_13: every cell (earlier version)", "src": "Turret%20Target%20Flip%20Panel/older/1%20-%20The%20Turret%20Target%20Flip%20Panel%2C%20one%20pack%202_13%20-%20every%20cell%20%28earlier%20version%29.png"}];
const $ = id => document.getElementById(id);
const stage = $("stage"), img = $("img");
let i = 0, s = 1, x = 0, y = 0;

// list, grouped by item
let last = null; const list = $("list");
CHARTS.forEach((c, n) => {
  if (c.item !== last) { const h = document.createElement("div"); h.className = "item"; h.textContent = c.item; list.appendChild(h); last = c.item; }
  const a = document.createElement("a"); a.href = "#" + (n + 1); a.textContent = c.title; a.onclick = e => { e.preventDefault(); show(n); $("side").classList.remove("open"); };
  list.appendChild(a);
});

function apply() { img.style.transform = `translate(${x}px,${y}px) scale(${s})`; }
function clamp() {
  const W = stage.clientWidth, H = stage.clientHeight, w = img.naturalWidth * s, h = img.naturalHeight * s;
  x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x));
  y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y));
}
function fit() { s = stage.clientWidth / img.naturalWidth; x = 0; y = 0; clamp(); apply(); }
function zoomAt(f, cx, cy) {
  const ns = Math.min(4, Math.max(0.03, s * f));
  x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; clamp(); apply();
}
function show(n) {
  i = (n + CHARTS.length) % CHARTS.length;
  const c = CHARTS[i];
  img.style.opacity = 0.25; img.src = c.src; $("open").href = c.src;
  $("title").innerHTML = ""; $("title").append(c.title); const sm = document.createElement("small"); sm.textContent = c.item; $("title").appendChild(sm);
  $("count").textContent = (i + 1) + " / " + CHARTS.length;
  document.querySelectorAll("#list a").forEach((a, k) => a.classList.toggle("on", k === i));
  document.querySelectorAll("#list a")[i].scrollIntoView({ block: "nearest" });
  history.replaceState(null, "", "#" + (i + 1));
  const pre = new Image(); pre.src = CHARTS[(i + 1) % CHARTS.length].src;
}
img.onload = () => { img.style.opacity = 1; fit(); };
addEventListener("resize", () => { clamp(); apply(); });

// drag and pinch
const pts = new Map(); let pinch = 0, moved = false;
stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); stage.classList.add("drag"); moved = false; });
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const [px, py] = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) { x += e.clientX - px; y += e.clientY - py; if (Math.abs(e.clientX - px) + Math.abs(e.clientY - py) > 2) moved = true; clamp(); apply(); }
  else if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = stage.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    pinch = d;
  }
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; if (!pts.size) stage.classList.remove("drag"); };
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
stage.addEventListener("dblclick", e => { const r = stage.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });

// buttons and keys
const mid = () => [stage.clientWidth / 2, stage.clientHeight / 2];
$("prev").onclick = () => show(i - 1); $("next").onclick = () => show(i + 1);
$("in").onclick = () => zoomAt(1.4, ...mid()); $("out").onclick = () => zoomAt(1 / 1.4, ...mid());
$("fit").onclick = fit; $("full").onclick = () => zoomAt(1 / s, ...mid());
$("menu").onclick = () => $("side").classList.toggle("open");
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") show(i + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") show(i - 1);
  else if (e.key === "+" || e.key === "=") zoomAt(1.4, ...mid());
  else if (e.key === "-") zoomAt(1 / 1.4, ...mid());
  else if (e.key === "0") fit();
  else if (e.key === "1") zoomAt(1 / s, ...mid());
  else if (e.key === "ArrowDown") { y -= 120; clamp(); apply(); }
  else if (e.key === "ArrowUp") { y += 120; clamp(); apply(); }
});
show(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
</script>
</body>
</html>
